name: Windows qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Select Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - run: rustup override set 1.97.1
      - run: npm ci
      - run: npm run lint
      - run: npm run test:frontend
      - run: npm run test:ui
      - run: npm run build
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npm audit --audit-level=moderate
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
        working-directory: src-tauri
      # Qualification builds are unsigned; only the Release workflow signs
      # updater artifacts with TAURI_SIGNING_PRIVATE_KEY.
      - run: npm run tauri build -- --config src-tauri/tauri.qualification.conf.json
      - name: Package checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object Extension -In '.exe', '.msi' |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding utf8 src-tauri/target/release/bundle/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-local-review
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/SHA256SUMS.txt
          retention-days: 14
