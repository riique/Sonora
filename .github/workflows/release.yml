name: Release
# Publishes a signed Windows installer and latest.json to GitHub Releases.
# Installed copies of Sonora check that file and update themselves.
#
# Bump the version across manifests and merge it to master to publish. Tag
# pushes and manual dispatch remain supported for exceptional cases.
on:
  push:
    tags: ['v*']
    # Publish an app update automatically when the version is merged into master.
    branches: [master]
    paths:
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch:
concurrency:
  group: sonora-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Select Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - run: npm ci
      - run: npm run lint
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tauri-action replaces __VERSION__ with the app version from tauri.conf.json.
          tagName: v__VERSION__
          releaseName: Sonora v__VERSION__
          releaseBody: Instale pelo .exe abaixo. Instalações existentes do Sonora atualizam sozinhas.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
